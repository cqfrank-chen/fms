# ============================================================
# 工厂管理系统 · Docker Compose 正式版（I02 地基完备化）
# 拓扑：nginx(80) → app(NestJS:3000) → postgres(18)
# 约束：postgres 不暴露宿主机端口（ADR-0001）；数据入卷 pgdata
# 用法：docker compose up -d --build（或根目录 install.bat）
# 变量：默认值见下，可用根目录 .env 覆盖（模板 .env.example）
# ============================================================

services:
  postgres:
    image: postgres:18
    container_name: fms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-fms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fms}
      POSTGRES_DB: ${DB_NAME:-fms}
    volumes:
      # PG18+ 要求挂 /var/lib/postgresql（内部按主版本子目录存放），
      # 直接挂 /var/lib/postgresql/data 会报 "unused mount/volume" 错误
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fms}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # 生产约束：不暴露宿主机端口（仅 compose 内网可达）
    # 开发直连时放开注释：
    # ports:
    #   - "5432:5432"

  app:
    image: fms-app:local
    build:
      context: ./apps/api
    container_name: fms-app
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-fms}
      DB_PASSWORD: ${DB_PASSWORD:-fms}
      DB_NAME: ${DB_NAME:-fms}
      PORT: 3000
      # 业务时区：日期/单号按本地业务日计算（东八区）。容器默认 UTC 会导致
      # 0-8 点的单号落到前一天、排期交期整体偏移一天。
      TZ: ${TZ:-Asia/Shanghai}
      # 登录鉴权（I15）：JWT 签名密钥；留空时服务启动随机生成并打印警告（重启后需重新登录）
      JWT_SECRET: ${JWT_SECRET:-}
      # AI 网关（I12）：根 .env 配置，重启 app 生效；AI_API_KEY 为空 → mock 降级
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-deepseek-chat}
      AI_VISION_BASE_URL: ${AI_VISION_BASE_URL:-}
      AI_VISION_KEY: ${AI_VISION_KEY:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen3-vl-flash}
      # 自动更新（I13）：构建提交号由安装/升级脚本写入 .env；更新源指向 GitHub 仓库
      FMS_BUILD_SHA: ${FMS_BUILD_SHA:-unknown}
      FMS_UPDATE_REPO: ${FMS_UPDATE_REPO:-cqfrank-chen/fms}
      FMS_UPDATE_BRANCH: ${FMS_UPDATE_BRANCH:-main}
      FMS_UPDATE_TOKEN: ${FMS_UPDATE_TOKEN:-}
    volumes:
      # 更新包 / 更新请求 / 宿主更新代理状态（与宿主 system\updates 共享）
      - ./updates:/app/updates
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: fms-nginx:local
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: fms-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - app

volumes:
  pgdata:
