name: Release package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建发布包（本地与 CI 共用同一脚本）
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME:-v0.0.0-dev}"
          pwsh -NoProfile -File packaging/build-package.ps1 -Version "$VERSION" -OutDir . -SkipDir
          ls -lh fms-*.zip

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            fms-system-*.zip
            fms-setup-*.zip
          generate_release_notes: true
          body: |
            - `fms-system-*.zip`：仅 system/（体积小，供「设置 · 系统更新」自动更新）
            - `fms-setup-*.zip`：完整安装包（含 setup.bat / 安装说明.txt / docker/，供新机安装）

            > CI 产出为瘦包（不含 Docker Desktop 安装器）；离线安装请把安装器放入 `docker/` 后再运行 `setup.bat`，
            > 或本地用 `packaging/build-package.ps1 -Fat` 生成胖包。
